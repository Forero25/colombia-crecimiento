name: Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ingesta/**", "dbt/**", "analisis/**", "tests/**", "entradas/**", "Dockerfile", "docker-compose.yml", "correr.sh", "requirements-pipeline.txt"]
  schedule:
    - cron: "17 11 2 * *"   # el día 2 de cada mes
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL + pipeline con Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from pipeline
      - name: Guardar resultados
        run: |
          sudo chown -R "$USER" resultados publicado || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados publicado
          git diff --cached --quiet || (git commit -m "Resultados actualizados" && git push)
