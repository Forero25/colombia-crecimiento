# docker compose up --build --abort-on-container-exit
# Levanta PostgreSQL, espera a que esté listo y corre el pipeline completo contra él.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-crecimiento}
      POSTGRES_DB: crecimiento
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crecimiento"]
      interval: 3s
      retries: 20
  pipeline:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-crecimiento}
      PGDATABASE: crecimiento
      DESCARGAR: ${DESCARGAR:-1}
    volumes:
      - ./data:/app/data
      - ./resultados:/app/resultados
      - ./publicado:/app/publicado
