version: 2
models:
  - name: stg_paises
    columns:
      - name: iso3
        tests: [unique, not_null]
  - name: stg_indicadores
    tests:
      - combinacion_unica: {arguments: {columns: [iso3, indicador, anio]}}
    columns:
      - name: valor
        tests: [not_null]
  - name: stg_github
    columns:
      - name: desarrolladores
        tests: [not_null]
